services:
  - type: web
    name: nutrition-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # Renderのダッシュボードで手動設定
      - key: DATABASE_URL
        fromDatabase:
          name: nutrition-db
          property: connectionString

databases:
  - name: nutrition-db
    databaseName: nutrition
    plan: free
