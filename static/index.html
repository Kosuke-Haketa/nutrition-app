<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>栄養バランス判定</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@simplewebauthn/browser@13/dist/bundle/index.es5.umd.min.js"></script>
</head>
<body>

  <!-- ログイン画面 -->
  <div id="loginScreen" class="login-overlay" style="display:none">
    <div class="login-card">
      <h1 class="login-title">栄養バランス判定</h1>
      <p class="login-sub">パスキーでログインして<br>食事記録を始めましょう</p>
      <div class="login-form">
        <label class="login-label" for="nicknameInput">ニックネーム</label>
        <input type="text" id="nicknameInput" class="login-input" placeholder="例: たろう" autocomplete="username webauthn" maxlength="20">
        <div id="loginError" class="login-error" style="display:none"></div>
        <button class="btn-passkey" id="btnRegister" onclick="registerPasskey()">パスキーで登録</button>
        <button class="btn-passkey btn-passkey-login" id="btnLogin" onclick="loginPasskey()">パスキーでログイン</button>
      </div>
    </div>
  </div>

  <!-- メインアプリ -->
  <div class="container" id="appScreen" style="display:none">
    <div class="app-header">
      <h1>栄養バランス判定</h1>
      <div class="user-info">
        <span id="userNickname" class="user-name"></span>
        <button class="btn-logout" onclick="doLogout()">ログアウト</button>
      </div>
    </div>

    <!-- タブ -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('analyze')">解析</button>
      <button class="tab" onclick="switchTab('history')">履歴</button>
    </div>

    <!-- 解析タブ -->
    <div id="tab-analyze">
      <!-- 日付 -->
      <div class="date-row">
        <label for="mealDate">日付</label>
        <input type="date" id="mealDate">
      </div>

      <!-- 画像アップロード -->
      <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept="image/*" hidden>
        <p>画像をドラッグ&amp;ドロップ</p>
        <p class="sub">または</p>
        <div class="upload-buttons">
          <button class="btn-secondary" onclick="openFilePicker()">ファイルを選択</button>
          <button class="btn-secondary" onclick="openCamera()">カメラで撮影</button>
        </div>
      </div>

      <!-- プレビュー -->
      <div class="preview-area" id="previewArea" style="display:none">
        <img id="previewImg" alt="食事の画像">
        <button class="btn-link" onclick="resetImage()">画像を変更</button>
      </div>

      <button class="btn-primary" id="analyzeBtn" onclick="analyze()" disabled>解析する</button>

      <!-- ローディング -->
      <div class="loading" id="loading" style="display:none">
        <div class="spinner"></div>
        <p>Claude が画像を解析中...</p>
      </div>

      <!-- エラー -->
      <div class="error" id="errorBox" style="display:none"></div>

      <!-- 結果 -->
      <div id="result" style="display:none">
        <section class="card">
          <h2>検出された食材</h2>
          <div id="foodList"></div>
          <button class="btn-secondary recalc" onclick="recalculate()">修正して再計算</button>
        </section>

        <section class="card">
          <h2>栄養バランス（1食分）</h2>
          <h3 class="section-label">エネルギー・主要栄養素</h3>
          <div id="macroSection"></div>
          <h3 class="section-label">ビタミン</h3>
          <div id="vitaminSection"></div>
        </section>

        <section class="card" id="suggestionCard">
          <h2>不足栄養素のおすすめ食材・料理</h2>
          <div id="suggestionSection"></div>
        </section>

        <section class="card" id="balanceScoreCard">
          <h2>バランススコア</h2>
          <div id="balanceScoreSection"></div>
        </section>

        <button class="btn-save" id="saveBtn" onclick="saveResult()">この食事を保存する</button>
        <div class="save-msg" id="saveMsg" style="display:none">保存しました</div>
        <button class="btn-slack" id="slackBtn" onclick="postToSlack()" style="display:none">Slackに投稿する</button>
        <div class="save-msg" id="slackMsg" style="display:none">Slackに投稿しました</div>
      </div>
    </div>

    <!-- 履歴タブ -->
    <div id="tab-history" style="display:none">
      <div id="historyList"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
